name: Verify NeuroScope
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ubuntu:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci && npm test && npm run build
      - name: Install and start the shipped systemd unit and Nginx site
        run: |
          sudo bash -se -- "$GITHUB_WORKSPACE" "$(node -p 'process.execPath')" <<'ROOT'
          if ! command -v nginx >/dev/null; then
            apt-get update -qq
            apt-get install -y nginx
          fi
          if [ "$(readlink -f /usr/bin/node)" != "$(readlink -f "$2")" ]; then
            ln -sfn "$2" /usr/bin/node
          fi
          ln -s "$1" /opt/NeuroScope
          cd /opt/NeuroScope
          install -m 0644 deploy/NeuroScope.service /etc/systemd/system/NeuroScope.service
          install -m 0644 deploy/host-nginx.conf /etc/nginx/sites-available/NeuroScope
          ln -sfn /etc/nginx/sites-available/NeuroScope /etc/nginx/sites-enabled/NeuroScope
          systemctl daemon-reload
          systemd-analyze verify /etc/systemd/system/NeuroScope.service
          nginx -t
          systemctl enable --now NeuroScope.service nginx
          systemctl reload nginx
          ROOT
          curl --retry 8 --retry-connrefused --retry-all-errors --retry-delay 1 -fsS http://127.0.0.1:16010/api/health
          test "$(ss -Hltn 'sport = :3010' | awk '{print $4}')" = '127.0.0.1:3010'
      - name: Exercise admin and display through Nginx in Chromium
        env:
          NEUROSCOPE_SCREENSHOTS: ${{ runner.temp }}/neuroscope-preview
        run: |
          python3 -m venv "$RUNNER_TEMP/neuroscope-browser"
          source "$RUNNER_TEMP/neuroscope-browser/bin/activate"
          pip install playwright==1.55.0 Pillow
          python -m playwright install --with-deps chromium
          python tests/browser_smoke.py
      - uses: actions/upload-artifact@v4
        with:
          name: neuroscope-preview
          path: ${{ runner.temp }}/neuroscope-preview/display.png
          retention-days: 7
      - if: failure()
        run: sudo journalctl -u NeuroScope.service -u nginx --no-pager -n 100
